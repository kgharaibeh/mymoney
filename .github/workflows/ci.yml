name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    # Postgres for the Prisma integration tests (RUN_DB_TESTS=1).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mymoney
          POSTGRES_PASSWORD: mymoney
          POSTGRES_DB: mymoney
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mymoney -d mymoney"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mymoney:mymoney@localhost:5432/mymoney?schema=public
      AUTH_SECRET: ci-test-secret
      RUN_DB_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @mymoney/api prisma:generate

      - name: Build (type-check + compile all packages)
        run: pnpm -r build

      - name: Apply migrations to Postgres
        run: pnpm --filter @mymoney/api prisma:migrate:deploy

      - name: Test
        run: pnpm -r test
