name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    # Postgres for the Prisma integration tests (RUN_DB_TESTS=1).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mymoney
          POSTGRES_PASSWORD: mymoney
          POSTGRES_DB: mymoney
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mymoney -d mymoney"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mymoney:mymoney@localhost:5432/mymoney?schema=public
      AUTH_SECRET: ci-test-secret
      RUN_DB_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @mymoney/api prisma:generate

      - name: Build (type-check + compile all packages)
        run: pnpm -r build

      - name: Apply migrations to Postgres
        run: pnpm --filter @mymoney/api prisma:migrate:deploy

      - name: Test
        run: pnpm -r test

  # Redeploy to the droplet after tests pass — only on a push to main (i.e. a
  # merge), never on PRs. SSHes in, pulls the merged code, and rebuilds.
  deploy:
    name: Deploy to droplet
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Gated by the `production` environment: a required reviewer must approve
    # each deploy before this job runs, and only protected branches (main) can
    # deploy to it.
    environment: production
    concurrency:
      group: deploy-droplet
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            cd /opt/mymoney
            git fetch --depth 1 origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml up -d --build
            sleep 10
            curl -fsS http://localhost:3000/health && echo
          '
